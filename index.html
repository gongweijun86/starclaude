<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#05060f" />
<meta name="description" content="starclaude.cn — 浩瀚星河，即将启航。Coming Soon." />
<link rel="preload" as="image" href="img/andromeda.jpg" />
<title>starclaude.cn · Coming Soon</title>
<style>
  :root{
    --ink:#f4f6ff;
    --ink-dim:rgba(220,228,255,.66);
    --ink-faint:rgba(200,210,255,.42);
    --accent:#c9b8ff;
    --accent-2:#7fe3ff;
    --gold:#ecd49b;
  }

  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%}
  body{
    background:#04050c;
    color:var(--ink);
    font-family:"PingFang SC","HarmonyOS Sans SC","Microsoft YaHei",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
    -webkit-font-smoothing:antialiased;
    text-rendering:optimizeLegibility;
    overflow:hidden;
    position:relative;
  }

  /* ===== NASA photo slideshow ===== */
  .bg{position:fixed;inset:0;z-index:0;background:#04050c}
  .slide{
    position:absolute;inset:0;
    background-size:cover;background-position:center center;
    opacity:1;
  }

  /* darken photos for text contrast while keeping them visible */
  .overlay{
    position:fixed;inset:0;z-index:1;pointer-events:none;
    background:
      radial-gradient(72% 62% at 50% 46%, rgba(5,6,15,.28), rgba(5,6,15,.04) 56%, rgba(5,6,15,.55) 100%),
      linear-gradient(180deg, rgba(5,6,15,.58) 0%, rgba(5,6,15,.20) 36%, rgba(5,6,15,.62) 100%);
  }

  /* subtle sparkle layer over the photos */
  #sky{position:fixed;inset:0;width:100%;height:100%;z-index:2;display:block;pointer-events:none}

  /* orbiting rings */
  .orbits{position:fixed;left:50%;top:50%;z-index:2;pointer-events:none;
    width:min(86vmin,820px);height:min(86vmin,820px);transform:translate(-50%,-50%);opacity:.32}
  .orbits .ring{position:absolute;inset:0;border-radius:50%;border:1px solid rgba(190,204,255,.14)}
  .orbits .ring.r2{inset:15%;border-color:rgba(190,204,255,.10)}
  .orbits .ring.r3{inset:29%;border-color:rgba(190,204,255,.07)}
  .orbits .spin{position:absolute;inset:0;border-radius:50%}
  .orbits .spin .dot{position:absolute;left:50%;top:-3px;width:6px;height:6px;margin-left:-3px;
    border-radius:50%;background:var(--accent);box-shadow:0 0 12px 2px rgba(201,184,255,.9)}
  .orbits .spin.s1{animation:spin 26s linear infinite}
  .orbits .spin.s2{inset:15%;animation:spin 38s linear infinite reverse}
  .orbits .spin.s2 .dot{background:var(--accent-2);box-shadow:0 0 12px 2px rgba(127,227,255,.9)}
  .orbits .spin.s3{inset:29%;animation:spin 18s linear infinite}
  .orbits .spin.s3 .dot{background:var(--gold);box-shadow:0 0 10px 2px rgba(236,212,155,.9)}
  @keyframes spin{to{transform:rotate(360deg)}}

  /* ===== content ===== */
  main{
    position:relative;z-index:3;height:100dvh;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    text-align:center;padding:24px;
  }

  .brand{
    display:inline-flex;align-items:center;gap:10px;
    font-size:13px;letter-spacing:.42em;font-weight:500;
    color:var(--ink-dim);text-transform:uppercase;
    padding:8px 18px;border:1px solid rgba(190,204,255,.20);border-radius:999px;
    background:rgba(10,12,24,.35);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
    text-shadow:0 1px 6px rgba(0,0,0,.6);
    opacity:0;animation:rise .9s .15s ease forwards;
  }
  .brand .star{color:var(--accent);font-size:12px;transform:translateY(-1px)}

  h1{
    margin-top:30px;
    font-size:clamp(2.8rem,11vw,8.4rem);
    line-height:.96;font-weight:300;letter-spacing:.06em;
    text-transform:uppercase;
    background:linear-gradient(180deg,#ffffff 8%,#cdd4f7 60%,#94a0dc 100%);
    -webkit-background-clip:text;background-clip:text;color:transparent;
    text-shadow:0 4px 40px rgba(0,0,0,.55),0 1px 3px rgba(0,0,0,.5);
    opacity:0;animation:rise 1.1s .3s ease forwards;
  }

  .tagline{
    margin-top:18px;font-size:clamp(.95rem,2.4vw,1.15rem);
    letter-spacing:.34em;color:var(--ink-dim);font-weight:300;
    text-shadow:0 1px 10px rgba(0,0,0,.7);
    opacity:0;animation:rise 1s .52s ease forwards;
  }
  .tagline .sep{color:var(--ink-faint);margin:0 .55em}

  .poem{
    margin-top:22px;max-width:560px;
    font-size:clamp(.92rem,2.1vw,1.02rem);line-height:1.9;
    color:var(--ink-faint);font-weight:300;letter-spacing:.04em;
    text-shadow:0 1px 10px rgba(0,0,0,.75);
    opacity:0;animation:rise 1s .68s ease forwards;
  }

  .chip{
    margin-top:34px;display:inline-flex;align-items:center;gap:9px;
    font-size:14px;letter-spacing:.14em;color:var(--ink);
    padding:11px 22px;border-radius:999px;
    border:1px solid rgba(201,184,255,.30);
    background:linear-gradient(180deg,rgba(201,184,255,.12),rgba(127,227,255,.07));
    backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
    box-shadow:0 0 0 1px rgba(255,255,255,.02) inset,0 14px 40px -22px rgba(127,160,255,.9);
    opacity:0;animation:rise 1s .84s ease forwards;
  }
  .chip .pulse{width:8px;height:8px;border-radius:50%;background:var(--accent-2);
    box-shadow:0 0 10px 1px var(--accent-2);animation:pulse 2.2s ease-in-out infinite}
  @keyframes pulse{0%,100%{opacity:.35;transform:scale(.8)}50%{opacity:1;transform:scale(1.25)}}

  footer{
    position:fixed;left:0;right:0;bottom:16px;z-index:3;
    text-align:center;font-size:11px;line-height:1.7;letter-spacing:.12em;
    color:var(--ink-faint);
    text-shadow:0 1px 8px rgba(0,0,0,.8);
    opacity:0;animation:rise 1s 1s ease forwards;
  }
  footer .credit{display:block;margin-top:3px;font-size:10px;letter-spacing:.08em;color:rgba(190,200,235,.34)}

  @keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}

  @media (max-width:560px){
    .brand{letter-spacing:.32em}
    h1{letter-spacing:.04em}
    .tagline{letter-spacing:.22em}
  }

  @media (prefers-reduced-motion: reduce){
    .slide{animation:none!important;transform:none}
    .orbits .spin,.chip .pulse{animation:none!important}
    .brand,h1,.tagline,.poem,.chip,footer{opacity:1;animation:none}
  }
</style>
</head>
<body>
  <!-- NASA deep-space imagery -->
  <div class="bg" aria-hidden="true">
    <div class="slide active" style="background-image:url(andromeda.jpg)"></div>
  </div>
  <div class="overlay" aria-hidden="true"></div>
  <canvas id="sky" aria-hidden="true"></canvas>
  <div class="orbits" aria-hidden="true">
    <div class="ring"></div>
    <div class="ring r2"></div>
    <div class="ring r3"></div>
    <div class="spin s1"><span class="dot"></span></div>
    <div class="spin s2"><span class="dot"></span></div>
    <div class="spin s3"><span class="dot"></span></div>
  </div>

  <main>
    <span class="brand"><span class="star">✦</span> STARCLAUDE</span>
    <h1>Coming&nbsp;Soon</h1>
    <p class="tagline">穿越无垠星海<span class="sep">·</span>即将启航</p>
    <p class="poem">于浩瀚宇宙深处，我们正在点亮一些非凡的事物。<br/>请稍候，星辰将至。</p>
    <span class="chip"><span class="pulse"></span>starclaude.cn</span>
  </main>

  <footer>
    © 2026 &nbsp;starclaude.cn
    <span class="credit">深空影像由 NASA 提供 · 公有领域（Hubble / JWST）</span>
  </footer>

<script>
(function(){
  /* single static background — no slideshow */
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  /* ---------- subtle sparkle field ---------- */
  var canvas = document.getElementById('sky');
  var ctx = canvas.getContext('2d');
  var w = 0, h = 0, dpr = 1, stars = [], shooters = [], nextShoot = 4000;
  var TINTS = ['255,255,255','255,255,255','214,224,255','255,238,210'];
  function rand(a,b){return a+Math.random()*(b-a);}
  function build(){
    stars = [];
    var n = Math.max(40, Math.min(110, Math.round(70 * (w*h)/(1366*768))));
    for (var i=0;i<n;i++){
      var z = Math.random();
      stars.push({x:Math.random()*w,y:Math.random()*h,z:z,r:z*1.2+0.2,
        tw:Math.random()*6.283,tws:rand(.5,1.6),tint:TINTS[(Math.random()*TINTS.length)|0]});
    }
  }
  function resize(){
    dpr = Math.min(window.devicePixelRatio||1, 2);
    w = window.innerWidth; h = window.innerHeight;
    canvas.width = Math.floor(w*dpr); canvas.height = Math.floor(h*dpr);
    canvas.style.width = w+'px'; canvas.style.height = h+'px';
    ctx.setTransform(dpr,0,0,dpr,0,0); build();
  }
  function spawnShoot(){
    var fromLeft = Math.random()<.5;
    var x = fromLeft ? -60 : w+60, y = rand(-20, h*.55);
    var ang = fromLeft ? rand(.12,.26)*Math.PI : Math.PI - rand(.12,.26)*Math.PI;
    var sp = rand(8,13);
    shooters.push({x:x,y:y,vx:Math.cos(ang)*sp,vy:Math.sin(ang)*sp,len:rand(110,200),life:0,max:rand(60,110)});
  }
  function draw(dt){
    for (var i=0;i<stars.length;i++){
      var s = stars[i];
      s.tw += dt*0.001*s.tws;
      var a = (0.25 + 0.55*(0.5+0.5*Math.sin(s.tw))) * (0.35 + s.z*0.55);
      ctx.beginPath();
      ctx.fillStyle = 'rgba('+s.tint+','+a.toFixed(3)+')';
      ctx.arc(s.x,s.y,s.r,0,6.283); ctx.fill();
      if (s.r>1.0){ctx.beginPath();ctx.fillStyle='rgba('+s.tint+','+(a*0.15).toFixed(3)+')';ctx.arc(s.x,s.y,s.r*2.6,0,6.283);ctx.fill();}
    }
    for (var j=shooters.length-1;j>=0;j--){
      var m=shooters[j]; m.life++; m.x+=m.vx; m.y+=m.vy;
      var sp=Math.hypot(m.vx,m.vy), tx=m.x-m.vx/sp*m.len, ty=m.y-m.vy/sp*m.len, fade=Math.max(0,1-m.life/m.max);
      var g=ctx.createLinearGradient(m.x,m.y,tx,ty);
      g.addColorStop(0,'rgba(255,255,255,'+(0.85*fade).toFixed(3)+')');
      g.addColorStop(.25,'rgba(190,210,255,'+(0.45*fade).toFixed(3)+')');
      g.addColorStop(1,'rgba(190,210,255,0)');
      ctx.strokeStyle=g; ctx.lineWidth=2; ctx.lineCap='round';
      ctx.beginPath(); ctx.moveTo(m.x,m.y); ctx.lineTo(tx,ty); ctx.stroke();
      ctx.beginPath(); ctx.fillStyle='rgba(255,255,255,'+(0.85*fade).toFixed(3)+')'; ctx.arc(m.x,m.y,1.6,0,6.283); ctx.fill();
      if (m.life>m.max||m.x<-120||m.x>w+120||m.y>h+120) shooters.splice(j,1);
    }
  }
  var last = performance.now();
  function frame(now){
    var dt = Math.min(40, now-last); last = now;
    ctx.clearRect(0,0,w,h); draw(dt);
    if (!reduce){ nextShoot-=dt; if(nextShoot<=0){spawnShoot(); nextShoot=rand(3500,8000);} }
    requestAnimationFrame(frame);
  }
  var rt; window.addEventListener('resize', function(){clearTimeout(rt); rt=setTimeout(resize,120);},{passive:true});
  resize();
  if (reduce){ ctx.clearRect(0,0,w,h); draw(0); }
  else { requestAnimationFrame(frame); }
})();
</script>
</body>
</html>
